# ==============================================================================
# Google Calendar Kürzelsystem & Buchungssyntax für KITE-MALLORCA
# Verbindliche Nomenklatur für Trainer-Zuweisung, Dispo und Google Calendar Integration
# ==============================================================================

syntax:
  title_template: "{Pax}{Kurskuerzel}, {Vorname}, {KontaktLink} ({Sprachen}) {Sonderwuensche}"
  description: "Kompakte Titelsyntax für Google Kalender Termine zur optimalen Lesbarkeit auf Smartphone & Kalender-Grid"
  fields:
    pax: "Teilnehmeranzahl (z.B. 1, 2, 3, 4 - bei 1 kann die Zahl vorangestellt werden wie '1Cc' oder '2Cc')"
    course_code: "Verbindliches Kurskuerzel (siehe 'courses')"
    first_name: "Vorname des Kunden / Hauptansprechpartners (z.B. 'Max', 'Julia & Tom')"
    contact_link: "Direkter Kommunikationslink ohne Leerzeichen (WhatsApp: wa.me/<landescode><nummer> oder RCS +<nummer>)"
    languages: "Gesprochene Sprachen in runden Klammern (z.B. '(de)', '(en)', '(de/en)', '(es)')"
    special_requests: "Sonderwünsche, Equipment-Hinweise oder Maße dahinter"
  examples:
    - title: "2Cc, Max, wa.me/34696264729 (de/en) Eig.Neo"
      explanation: "2 Personen 10h Kitesurf Grundkurs, Max, WhatsApp Kontakt, Sprachen Deutsch/Englisch, eigener Neoprenanzug vorhanden"
    - title: "1Pr, Sarah, wa.me/491701234567 (en) Boot"
      explanation: "1 Person Kitesurf Privatstunde 1:1, Sarah, WhatsApp Kontakt, Englisch, Bootsschulung erwünscht"
    - title: "1TrCc, Lukas, RCS +34696264729 (de) Gross (2m/105kg)"
      explanation: "1 Person Schnupperkurs mit Upgrade-Option auf 10h, Lukas, RCS Kontakt, Deutsch, XXL Equipment"
    - title: "2Semi, Felix, wa.me/491512345678 (de) Trapez Gr. L"
      explanation: "2 Personen Semiprivat 2:1, Felix, WhatsApp Kontakt, Deutsch"
    - title: "3Wfc, Elena, wa.me/34611223344 (es/en)"
      explanation: "3 Personen Wingfoil Gruppenkurs, Elena, Spanisch/Englisch"
    - title: "1WfcPr, Marc, wa.me/33612345678 (fr/en) Eig.Foil"
      explanation: "1 Person Wingfoil Privatunterricht 1:1, Marc, Französisch/Englisch"
    - title: "1R, Jens, wa.me/49160998877 (de) Kite 12m + Board"
      explanation: "Kite Rental / Materialmiete (blockiert keinen Trainer)"
    - title: "1WR, Sophie, wa.me/34699887766 (en) 5m Wing"
      explanation: "Wingfoil Rental / Materialmiete (blockiert keinen Trainer)"
    - title: "2Ds, Jan, wa.me/491712345678 (de) 2027"
      explanation: "2 Personen Dockstart Session mit mobiler Plattform (1h Coaching), Jan, WhatsApp Kontakt, Deutsch"
    - title: "1DsPr, Tim, wa.me/49160991122 (de) Eig.Foil"
      explanation: "1 Person Dockstart Privatunterricht 1:1 mit mobiler Plattform, Tim, WhatsApp Kontakt, eigenes Foil"
    - title: "Block, Daniel, Pause / frei"
      explanation: "Trainer abwesend / Pause / frei"

courses:
