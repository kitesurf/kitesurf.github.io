contact_formats:
  whatsapp:
    syntax: "wa.me/<LandesvorwahlOhnePlus><Nummer>"
    example: "wa.me/34696264729"
    note: "Direkt klickbar auf iOS und Android Smartphones"
  rcs:
    syntax: "RCS +<Landesvorwahl><Nummer>"
    example: "RCS +34696264729"
    note: "RCS / SMS Textnachrichten"

languages:
  brackets: "({Sprachen})"
  examples:
    - code: "de"
      name: "Deutsch"
    - code: "en"
      name: "Englisch"
    - code: "es"
      name: "Spanisch"
    - code: "fr"
      name: "Französisch"
    - code: "it"
      name: "Italienisch"
    - code: "de/en"
      name: "Deutsch und Englisch"
    - code: "es/en"
      name: "Spanisch und Englisch"

special_requests_examples:
  - code: "Eig.Neo"
    description: "Eigener Neoprenanzug vorhanden"
  - code: "Boot"
    description: "Bootsschulung erwünscht / erforderlich"
  - code: "Gross (2m/105kg)"
    description: "Körpermaße für Materialdisposition (Trapez XXL, Board 145+ cm)"
  - code: "VDWS"
    description: "VDWS Lizenzprüfung erwünscht"
