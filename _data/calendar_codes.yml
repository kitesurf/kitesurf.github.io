    duration_hours: 10
    duration_days: "3–5"
    max_pax: 4
    type: "group"
    trainer_exclusive: false
    fasthooked_service_id: "22222222-1111-4111-8111-000000000001"
    description: "10h Kitesurf Grundkurs (Complete Course, max. 4 Pax Gruppe)"

  - code: "Tr"
