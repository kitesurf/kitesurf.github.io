    languages: es - en
    review_at: Google
    author_link: https://www.google.com/maps/contrib/106235793320365814316/reviews
    quote: 5
    review: Experiencia inolvidable. grandes profesionales con ganas de hacer que
      disfrutes de este deporte cada segundo del curso. Se preocuparon en todo momento
      de que los equipos fueran adecuados para el clima y mi nivel de experiencia,
      controlando todos mis avances y necesidades. Fue un curso de 10 horas, que me
      permitió conocer las nociones básicas del Kitesurf y ser capaz de tener autonomía
      para empezar a practicar el deporte por mi cuenta. Un 10 para Kite-Mallorca.
    org_link: https://business.google.com/reviews/l/10178801782382655446?hl=es
