<!DOCTYPE html>
<html lang="{{ page.lang | default: 'pt' }}">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | default: "Redirecionando..." }}</title>
    <link rel="canonical" href="{{ page.redirect.to }}">
    <script>location="{{ page.redirect.to }}"</script>
    <meta http-equiv="refresh" content="0; url={{ page.redirect.to }}">
    <meta name="robots" content="noindex">
  </head>
  <body>
    <h1>{{ page.title | default: "Redirecionando..." }}</h1>
    <p><a href="{{ page.redirect.to }}">{{ page.title | default: page.redirect.to }}</a></p>
  </body>
</html>
