{% assign lang = site.data.texts[page.lang] %}
{% assign nav = site.data.navigation[page.lang] %}
<style>.cc-window .cc-link{opacity:1!important;color:#fff!important;text-decoration:underline!important;font-weight:700!important}</style>
<script>
function initCookieConsent() {
  if (window.cookieconsent) {
    window.cookieconsent.initialise({
      "palette": {
        "popup": {
          "background": "#0d73a7",
          "text": "#ffffff",
          "link": "#ffffff"
        },
        "button": {
          "background": "#df061c",
          "text": "#ffffff"
        }
      },
      "theme": "classic",
      "position": "bottom-left",
      "content": {
        "message": "{{ lang.cookie_message }}",
        "dismiss": "{{ lang.cookie_dismiss }}",
        "link": "{{ lang.cookie_link }}",
        "href": "{{ site.baseurl }}/{{ page.lang }}/{{ nav.privacy.url | default: 'datenschutz/' }}"
      },
      "onPopupOpen": function() {
        var el = this.element;
        if (el) {
          var link = el.querySelector('.cc-link');
          if (link) { link.removeAttribute('aria-label'); }
          var btn = el.querySelector('.cc-btn');
          if (btn) { btn.removeAttribute('aria-label'); }
        }
      },
      "onInitialise": function(status) {
        var el = this.element;
        if (el) {
          var link = el.querySelector('.cc-link');
          if (link) { link.removeAttribute('aria-label'); }
          var btn = el.querySelector('.cc-btn');
          if (btn) { btn.removeAttribute('aria-label'); }
        }
      }
    });
  } else {
    setTimeout(initCookieConsent, 100);
  }
}

if ('requestIdleCallback' in window) {
  window.requestIdleCallback(function () {
    setTimeout(initCookieConsent, 1200);
  });
} else {
  window.addEventListener("load", function () {
    setTimeout(initCookieConsent, 1200);
  });
}
</script>
