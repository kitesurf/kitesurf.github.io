{% assign lang = site.data.texts[page.lang] %}
<script>
window.addEventListener("load", function(){
  if (window.cookieconsent) {
    window.cookieconsent.initialise({
      "palette": {
        "popup": {
          "background": "#2799d1",
          "text": "#3e4141"
        },
        "button": {
          "background": "#df061c",
          "text": "#ffffff"
        }
      },
      "theme": "classic",
      "position": "bottom-left",
      "content": {
        "message": "{{ lang.cookie_message }}",
        "dismiss": "{{ lang.cookie_dismiss }}",
        "link": "{{ lang.cookie_link }}",
        "href": "{{ lang.cookie_href }}"
      },
      "elements": {
        "messagelink": '<span id="cookieconsent:desc" class="cc-message">{{message}} <a aria-label="{{link}}" role="button" tabindex="0" class="cc-link" href="{{href}}" target="_blank">{{link}}</a></span>',
        "dismiss": '<a aria-label="{{dismiss}}" role="button" tabindex="0" class="cc-btn cc-dismiss">{{dismiss}}</a>'
      }
    });
  }
});
</script>
