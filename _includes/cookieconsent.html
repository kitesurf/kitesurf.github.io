{% assign lang = site.data.texts[page.lang] %}
{% assign nav = site.data.navigation[page.lang] %}
<script>
window.addEventListener("load", function(){
  if (window.cookieconsent) {
    window.cookieconsent.initialise({
      "palette": {
        "popup": {
          "background": "#0d73a7",
          "text": "#ffffff",
          "link": "#ffffff"
        },
        "button": {
          "background": "#df061c",
          "text": "#ffffff"
        }
      },
      "theme": "classic",
      "position": "bottom-left",
      "content": {
        "message": "{{ lang.cookie_message }}",
        "dismiss": "{{ lang.cookie_dismiss }}",
        "link": "{{ lang.cookie_link }}",
        "href": "{{ site.baseurl }}/{{ page.lang }}/{{ nav.privacy.url | default: 'datenschutz/' }}"
      },
      "onPopupOpen": function() {
        var el = this.element;
        if (el) {
          var link = el.querySelector('.cc-link');
          if (link) { link.removeAttribute('aria-label'); }
          var btn = el.querySelector('.cc-btn');
          if (btn) { btn.removeAttribute('aria-label'); }
        }
      },
      "onInitialise": function(status) {
        var el = this.element;
        if (el) {
          var link = el.querySelector('.cc-link');
          if (link) { link.removeAttribute('aria-label'); }
          var btn = el.querySelector('.cc-btn');
          if (btn) { btn.removeAttribute('aria-label'); }
        }
      }
    });
  }
});
</script>
