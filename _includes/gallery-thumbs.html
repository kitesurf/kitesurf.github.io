{% if page.amp == true %}
    <amp-carousel class="carousel2" layout=responsive height=480 width=640 type=slides>
        {% for image in site.data[page.dataFile].images %}
        <figure class="slide">
            {% if site.url contains 'localhost' or site.url contains '127.0.0.1' %}
            <amp-img on="tap:lightbox1" role="button" tabindex="0" layout="responsive" aria-describedby="nodisplay" src="{{ site.baseurl }}/images/flying-friends/l_{{ image.image }}" alt="{{ image.alt }}" height="480" width="640" title="{{ image.title }}" ></amp-img>
            {% else %}
            <amp-img on="tap:lightbox1" role="button" tabindex="0" layout="responsive" aria-describedby="nodisplay" src="{{ site.baseurl }}/cdn-cgi/image/width=640,quality=85,format=auto/images/flying-friends/l_{{ image.image }}" alt="{{ image.alt }}" height="480" width="640" title="{{ image.title }}" ></amp-img>
            {% endif %}
            <figcaption id="nodisplay">
                <h4>{{ image.name }}</h4>
                <p>{{ image.description }}</p>
            </figcaption>
        </figure>
        {% endfor %}
    </amp-carousel>
    {% assign lang = site.data.texts[page.lang] %}
    <span>{{ lang.slide-message }}</span>
{% else %}
    <noscript>
        <style type="text/css">
            .pagecontainer {display:none;}
        </style>
        <div class="noscriptmsg" itemscope itemtype="https://schema.org/ImageGallery">
            {% for image in site.data[page.dataFile].images %}
            <figure itemprop="associatedMedia" itemscope itemtype="https://schema.org/ImageObject">
            <a href="#image-{{ forloop.index }}">
                <img src="{{ site.baseurl }}/images/flying-friends/t_{{ image.image }}" alt="Thumb Picture: {{ image.alt }}" />
            </a>
            </figure>
            {% endfor %}
        </div>
    </noscript>
    <div class="gallery" itemscope itemtype="http://schema.org/ImageGallery">

            <figure itemprop="associatedMedia" itemscope itemtype="https://schema.org/ImageObject">     
            {% for image in site.data[page.dataFile].images %}   
            <span class="my-simple-gallery">
            {% if site.url contains 'localhost' or site.url contains '127.0.0.1' %}
            <a href="{{ site.baseurl }}/images/flying-friends/l_{{ image.image }}" itemprop="contentUrl" data-size="640x480">
            <img
                src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                data-srcset="{{ site.baseurl }}/images/flying-friends/s_{{ image.image }}"
                data-sizes="auto"
                class="lazyload"
                itemprop="thumbnail" 
                alt="{{ image.alt }}" title="{{ image.title }}"/>
            </a>
            {% else %}
            <a href="{{ site.baseurl }}/cdn-cgi/image/width=1200,quality=85,format=auto/images/flying-friends/l_{{ image.image }}" itemprop="contentUrl" data-size="640x480">
            <img
                src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
                data-srcset="{{ site.baseurl }}/cdn-cgi/image/width=320,quality=85,format=auto/images/flying-friends/l_{{ image.image }}"
                data-sizes="auto"
                class="lazyload"
                itemprop="thumbnail" 
                alt="{{ image.alt }}" title="{{ image.title }}"/>
            </a>
            {% endif %}
                    <figcaption itemprop="caption description">{{ image.description }}</figcaption>
            </span>
            {% endfor %}
            </figure>
    </div>    
{% endif %}
