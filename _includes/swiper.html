
<!-- Swiper -->
<section>
  <div class="swiper-container">
    <div class="swiper-wrapper" itemscope itemtype="http://schema.org/ImageGallery">
      {% for item in site.data.sliderimages.lang[page.lang] %}
      {% assign mobile_img = item.jpeg.m | default: item.image %}
      <div class="swiper-slide">
        <figure itemprop="associatedMedia" itemscope itemtype="https://schema.org/ImageObject">     
          <picture>
            {% if forloop.first %}
              {% if site.url contains 'localhost' or site.url contains '127.0.0.1' %}
                <source media="(max-width: 500px)" srcset="{{ site.baseurl }}{{ mobile_img }}" width="500" height="500">
                <img src="{{ site.baseurl }}{{ item.image }}" alt="{{ item.alt }}" title="{{ item.alt }}" fetchpriority="high" draggable="false" width="1200" height="480">
              {% else %}
                <source media="(min-width: 1024px)" srcset="{{ site.baseurl }}/cdn-cgi/image/width=1200,quality=85,format=auto{{ item.image }}" width="1200" height="480">
                <source media="(min-width: 501px)" srcset="{{ site.baseurl }}/cdn-cgi/image/width=800,quality=85,format=auto{{ item.image }}" width="800" height="320">
                <source media="(max-width: 500px)" srcset="{{ site.baseurl }}/cdn-cgi/image/width=500,quality=85,format=auto{{ mobile_img }}" width="500" height="500">
                <img src="{{ site.baseurl }}/cdn-cgi/image/width=1200,quality=85,format=auto{{ item.image }}" alt="{{ item.alt }}" title="{{ item.alt }}" fetchpriority="high" draggable="false" width="1200" height="480">
              {% endif %}
            {% else %}
              {% if site.url contains 'localhost' or site.url contains '127.0.0.1' %}
                <source media="(max-width: 500px)" data-srcset="{{ site.baseurl }}{{ mobile_img }}" width="500" height="500">
                <img data-src="{{ site.baseurl }}{{ item.image }}" srcset="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ item.alt }}" title="{{ item.alt }}" data-sizes="auto" class="lazyload" loading="lazy" draggable="false" width="1200" height="480">
              {% else %}
                <source media="(min-width: 1024px)" data-srcset="{{ site.baseurl }}/cdn-cgi/image/width=1200,quality=85,format=auto{{ item.image }}" width="1200" height="480">
                <source media="(min-width: 501px)" data-srcset="{{ site.baseurl }}/cdn-cgi/image/width=800,quality=85,format=auto{{ item.image }}" width="800" height="320">
                <source media="(max-width: 500px)" data-srcset="{{ site.baseurl }}/cdn-cgi/image/width=500,quality=85,format=auto{{ mobile_img }}" width="500" height="500">
                <img data-src="{{ site.baseurl }}/cdn-cgi/image/width=1200,quality=85,format=auto{{ item.image }}" srcset="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ item.alt }}" title="{{ item.alt }}" data-sizes="auto" class="lazyload" loading="lazy" draggable="false" width="1200" height="480">
              {% endif %}
            {% endif %}
          </picture>
          <a class="text_bgd" href="{{ item.link }}" draggable="false">
          <span><strong>{{ item.title }}</strong></span>
          <p>{{ item.description }}</p>
          <span class="btn">
             <strong>{{ item.button_text }}</strong>
          </span>
          </a>         
        </figure>
      </div>
      {% endfor %}
    </div>
    <!-- Add Pagination -->
    <div class="swiper-pagination"></div>
  </div>
</section>
<!-- Swiper JS -->
  <script defer src="{{ site.baseurl }}/js/swiper.min.js"></script>

<!-- Initialize Swiper -->
  <script>
    function initHeroSwiper() {
      if (typeof Swiper === 'undefined') {
        setTimeout(initHeroSwiper, 40);
        return;
      }
      var swiper = new Swiper('.swiper-container', {
        speed: 1000,
        effect: 'cube',
        loop: true,
        grabCursor: true,
        simulateTouch: true,
        allowTouchMove: true,
        touchRatio: 1,
        threshold: 0,
        preventClicks: true,
        preventClicksPropagation: true,
        touchStartPreventDefault: true,
        keyboard: {
          enabled: true,
        },
        a11y: {
          enabled: true,
          prevSlideMessage: 'Previous slide',
          nextSlideMessage: 'Next slide',
          firstSlideMessage: 'This is the first slide',
          lastSlideMessage: 'This is the last slide',
          paginationBulletMessage: 'Go to slide {{index}}',
        },
        cubeEffect: {
          shadow: true,
          slideShadows: true,
          shadowOffset: 20,
          shadowScale: 0.94,
        },
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
          renderBullet: function (index, className) {
            return '<span class="' + className + '" role="button" tabindex="0" aria-label="Slide ' + (index + 1) + '"></span>';
          }
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initHeroSwiper);
    } else {
      initHeroSwiper();
    }
  </script>
