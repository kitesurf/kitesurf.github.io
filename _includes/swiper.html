
<!-- Swiper -->
<section>
  <div class="swiper-container">
    <div class="swiper-wrapper" itemscope itemtype="http://schema.org/ImageGallery">
      {% for item in site.data.sliderimages.lang[page.lang] %}
      <div class="swiper-slide">
        <figure itemprop="associatedMedia" itemscope itemtype="https://schema.org/ImageObject">     
          <picture>
            {% if forloop.first %}
            <source type="image/webp" media="(min-width: 500px)" srcset="{{ item.webp.xl }}">
            <source type="image/webp" media="(max-width: 500px)" srcset="{{ item.webp.m }}">
            <source type="image/jpeg" media="(min-width: 500px)" srcset="{{ item.jpeg.xl }}">
            <source type="image/jpeg" media="(max-width: 500px)" srcset="{{ item.jpeg.m }}">
            <img src="{{ item.image }}" alt="{{ item.alt }}" title="{{ item.alt }}" fetchpriority="high">
            {% else %}
            <source type="image/webp" media="(min-width: 500px)" data-srcset="{{ item.webp.xl }}">
            <source type="image/webp" media="(max-width: 500px)" data-srcset="{{ item.webp.m }}">
            <source type="image/jpeg" media="(min-width: 500px)" data-srcset="{{ item.jpeg.xl }}">
            <source type="image/jpeg" media="(max-width: 500px)" data-srcset="{{ item.jpeg.m }}">
            <img data-src="{{ item.image }}" srcset="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ item.alt }}" title="{{ item.alt }}" data-sizes="auto" class="lazyload" loading="lazy">
            {% endif %}
          </picture>
          <a class="text_bgd" href="{{ item.link }}">
          <span><strong>{{ item.title }}</strong></span>
          <p>{{ item.description }}</p>
          <button class="btn">
             <strong>{{ item.button_text }}</strong>
          </button>
          </a>         
        </figure>
      </div>
      {% endfor %}
    </div>
    <!-- Add Pagination -->
    <div class="swiper-pagination"></div>
  </div>
</section>
<!-- Swiper JS -->
  <script src="{{ site.baseurl }}/js/swiper.min.js"></script>

<!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper('.swiper-container', {
      speed: 1000,
      effect: 'cube',
      loop: true,
      grabCursor: true,
      keyboard: {
        enabled: true,
      },
      cubeEffect: {
        shadow: true,
        slideShadows: true,
        shadowOffset: 20,
        shadowScale: 0.94,
      },
      autoplay: {
        delay: 2500,
        disableOnInteraction: false,
      },
      pagination: {
        el: '.swiper-pagination',
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
    });
  </script>
<style type="text/css" media="screen">
section {
  padding-top: 75px;
  overflow: hidden;
}
.content {
  width: 90%;
  height: auto;
}
.swiper-container {
  width: 84vw;
  height: 84vw;
  max-width: 380px;
  max-height: 380px;
  margin: 10px auto 0;
  padding: 0;
  perspective-origin: 50% 50%;
  -webkit-perspective-origin: 50% 50%;
}
@media only screen and (min-width: 480px) {
  section {
    padding-top: 80px;
  }
  .swiper-container {
    width: 75vw;
    height: 75vw;
    max-width: 440px;
    max-height: 440px;
  }
}
@media only screen and (min-width: 768px) {
  section {
    padding-top: 90px;
  }
  .swiper-container {
    width: 520px;
    height: 520px;
    max-width: 520px;
    max-height: 520px;
  }
}
.swiper-slide {
  background-position: center;
  background-size: cover;
}
.swiper-slide figure {
  width: 100%;
  height: 100%;
  position: relative;
  margin: 0;
}
.swiper-slide img {
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  -ms-transform: translate(-50%, -50%);
  -webkit-transform: translate(-50%, -50%);
  -moz-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  position: absolute;
  left: 50%;
  top: 50%;
}
.text_bgd {
  position: absolute;
  display: block;
  width: 90%;
  left: 5%;
  bottom: 8%;
  cursor: pointer;
  background-color: rgba(51, 51, 51, 0.85);
  padding: 6px 10px;
  outline: 0;
  z-index: 2;
  border-radius: 4px;
  box-sizing: border-box;
}
.text_bgd > span,
.text_bgd > p {
  margin: 0.25rem 0;
  opacity: 1.0;
  color: #ffffff;
  display: block;
  text-align: center;
}
.text_bgd > span {
  line-height: 1.2;
  font-size: 1.15rem;
}
.text_bgd > p {
  font-size: 0.78rem;
  line-height: 1.3;
}
@media only screen and (min-width: 768px) {
  .text_bgd > span {
    font-size: 1.45rem;
  }
  .text_bgd > p {
    font-size: 0.85rem;
  }
}
.btn {
  position: relative;
  display: inline-block;
  margin: 6px auto 2px;
  padding: 6px 14px;
  min-height: 32px;
  line-height: 1.3;
  overflow: hidden;
  border-width: 0;
  outline: none;
  border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .6);  
  background-color: #c84b00;
  color: #ffffff;
  font-size: 0.85rem;
}
#main {
  padding-top: 10px;
}
</style>
