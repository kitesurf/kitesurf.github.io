
<!-- Swiper -->
<section>
  <div class="swiper-container">
    <div class="swiper-wrapper" itemscope itemtype="http://schema.org/ImageGallery">
      {% for item in site.data.sliderimages.lang[page.lang] %}
      <div class="swiper-slide">
        <figure itemprop="associatedMedia" itemscope itemtype="https://schema.org/ImageObject">     
          <picture>
            {% if forloop.first %}
            <source type="image/webp" media="(min-width: 500px)" srcset="{{ item.webp.xl }}">
            <source type="image/webp" media="(max-width: 500px)" srcset="{{ item.webp.m }}">
            <source type="image/jpeg" media="(min-width: 500px)" srcset="{{ item.jpeg.xl }}">
            <source type="image/jpeg" media="(max-width: 500px)" srcset="{{ item.jpeg.m }}">
            <img src="{{ item.image }}" alt="{{ item.alt }}" title="{{ item.alt }}" fetchpriority="high" draggable="false">
            {% else %}
            <source type="image/webp" media="(min-width: 500px)" data-srcset="{{ item.webp.xl }}">
            <source type="image/webp" media="(max-width: 500px)" data-srcset="{{ item.webp.m }}">
            <source type="image/jpeg" media="(min-width: 500px)" data-srcset="{{ item.jpeg.xl }}">
            <source type="image/jpeg" media="(max-width: 500px)" data-srcset="{{ item.jpeg.m }}">
            <img data-src="{{ item.image }}" srcset="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="{{ item.alt }}" title="{{ item.alt }}" data-sizes="auto" class="lazyload" loading="lazy" draggable="false">
            {% endif %}
          </picture>
          <a class="text_bgd" href="{{ item.link }}" draggable="false">
          <span><strong>{{ item.title }}</strong></span>
          <p>{{ item.description }}</p>
          <span class="btn">
             <strong>{{ item.button_text }}</strong>
          </span>
          </a>         
        </figure>
      </div>
      {% endfor %}
    </div>
    <!-- Add Pagination -->
    <div class="swiper-pagination"></div>
  </div>
</section>
<!-- Swiper JS -->
  <script defer src="{{ site.baseurl }}/js/swiper.min.js"></script>

<!-- Initialize Swiper -->
  <script>
    function initHeroSwiper() {
      if (typeof Swiper === 'undefined') {
        setTimeout(initHeroSwiper, 40);
        return;
      }
      var swiper = new Swiper('.swiper-container', {
        speed: 1000,
        effect: 'cube',
        loop: true,
        grabCursor: true,
        simulateTouch: true,
        allowTouchMove: true,
        touchRatio: 1,
        threshold: 0,
        preventClicks: true,
        preventClicksPropagation: true,
        touchStartPreventDefault: true,
        keyboard: {
          enabled: true,
        },
        a11y: {
          enabled: true,
          prevSlideMessage: 'Previous slide',
          nextSlideMessage: 'Next slide',
          firstSlideMessage: 'This is the first slide',
          lastSlideMessage: 'This is the last slide',
          paginationBulletMessage: 'Go to slide {{index}}',
        },
        cubeEffect: {
          shadow: true,
          slideShadows: true,
          shadowOffset: 20,
          shadowScale: 0.94,
        },
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
          renderBullet: function (index, className) {
            return '<span class="' + className + '" role="button" tabindex="0" aria-label="Slide ' + (index + 1) + '"></span>';
          }
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initHeroSwiper);
    } else {
      initHeroSwiper();
    }
  </script>
<style type="text/css" media="screen">
section {
  padding-top: 2%;
}
.content {
  width: 90%;
  height: auto;
}
.swiper-container {
  padding-top: 20px;
  height: 500px;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  touch-action: pan-y;
}
.swiper-slide {
  background-position: center;
  background-size: cover;
  user-select: none;
  -webkit-user-select: none;
}
.swiper-slide figure {
  width: 100%;
  height: 100%;
  margin: 0;
}
.swiper-slide figure,
.swiper-slide img,
.swiper-slide a {
  -webkit-user-drag: none;
  -khtml-user-drag: none;
  -moz-user-drag: none;
  -o-user-drag: none;
  user-drag: none;
  user-select: none;
  -webkit-user-select: none;
}
.swiper-slide img {
  width: auto;
  height: auto;
  max-width: 98%;
  max-height: 100%;
  -ms-transform: translate(-50%, -50%);
  -webkit-transform: translate(-50%, -50%);
  -moz-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  position: absolute;
  left: 50%;
  top: 50%;
  pointer-events: auto;
}
.text_bgd {
  position: absolute;
  display: block;
  left: 10%;
  bottom: 10%;
  width: -webkit-fit-content;
  width: -moz-fit-content;
  width: fit-content;
  max-width: 80%;
  cursor: pointer;
  background-color: rgba(51, 51, 51, 0.85);
  padding: 12px 20px;
  outline: 0;
  z-index: 2;
  border-radius: 6px;
  box-sizing: border-box;
  text-align: center;
}
.text_bgd > span,
.text_bgd > p {
  margin: 0.35rem 0;
  opacity: 1.0;
  color: #ffffff;
  display: block;
  text-align: center;
}
.text_bgd > span {
  line-height: 1.2;
  font-size: 1.5rem;
}
.text_bgd > p {
  font-size: 0.95rem;
  line-height: 1.35;
}
.btn {
  position: relative;
  display: inline-block;
  width: -webkit-fit-content;
  width: -moz-fit-content;
  width: fit-content;
  max-width: 90%;
  margin: 10px auto 2px;
  padding: 8px 20px;
  min-height: 36px;
  line-height: 1.4;
  overflow: hidden;
  border-width: 0;
  outline: none;
  border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .6);  
  background-color: #c84b00;
  color: #ffffff;
  text-align: center;
  box-sizing: border-box;
  white-space: nowrap;
}
#main {
  padding-top: 10px;
}

/* ========================================================
   MOBILE ONLY (<= 500px)
   Exakter Breakpoint für die quadratischen 1:1 Bilder
   ======================================================== */
@media only screen and (max-width: 500px) {
  section {
    padding-top: 75px;
  }
  .swiper-container {
    padding-top: 0;
    width: 88vw;
    height: 88vw;
    max-width: 400px;
    max-height: 400px;
    margin: 10px auto 0;
    perspective-origin: 50% 50%;
    -webkit-perspective-origin: 50% 50%;
  }
  .swiper-slide img {
    max-width: 100%;
    max-height: 100%;
  }
  .text_bgd {
    position: absolute;
    display: block;
    width: 90%;
    max-width: 360px;
    height: auto;
    left: 50%;
    transform: translateX(-50%);
    bottom: 8%;
    padding: 6px 10px;
    border-radius: 4px;
    box-sizing: border-box;
    text-align: center;
  }
  .text_bgd > span {
    font-size: 1.15rem;
    line-height: 1.2;
    margin: 0.2rem 0;
  }
  .text_bgd > p {
    font-size: 0.78rem;
    line-height: 1.3;
    margin: 0.2rem 0;
  }
  .btn {
    display: inline-block;
    width: -webkit-fit-content;
    width: -moz-fit-content;
    width: fit-content;
    max-width: 90%;
    margin: 4px auto 2px;
    padding: 5px 14px;
    min-height: 30px;
    font-size: 0.82rem;
    line-height: 1.3;
    border-radius: 3px;
    white-space: nowrap;
  }
}
</style>
